app:
  github-token: ${GITHUB_TOKEN} # env variable
  stackoverflow:
    key: ${SO_TOKEN_KEY}
    access-token: ${SO_ACCESS_TOKEN}


url:
  updates: "http://bot:8082/updates"
spring:
  application:
    name: Scrapper

  datasource:
    url: jdbc:postgresql://localhost:5434/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true                      # включаем миграции для тестов
    
    change-log: classpath:/migrations/changelog/master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    topic:
      updates: "notifications"
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: 1
        spring:
          json:
            add:
              type:
                headers: false

server:
  port: 8082

access-type:
  ORM
message-transport:
  Kafka #{Kafka, HTTP} for update transport
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
