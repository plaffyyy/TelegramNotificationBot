app:
  telegram-token: ${TELEGRAM_TOKEN}
url:
  links: "http://scrapper:8082/links"
  tg-chats: "http://scrapper:8082/tg-chat"
spring:
  kafka:
    topic:
      updates: "notifications"
    bootstrap-servers: kafka:29092
    consumer:
      group-id: bot   
  application:
    name: Bot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8082

bot:
  notification:
    mode: DAILY_DIGEST  # or IMMEDIATE
    digest-time: "10:00"  # time of day to send the digest

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
