app:
  telegram-token: ${TELEGRAM_TOKEN}

resilience4j:
  retry:
    instances:
      httpRetry:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.util.concurrent.TimeoutException

  circuitbreaker:
    instances:
      httpCB:
        sliding-window-size: 1
        minimum-number-of-calls: 1
        failure-rate-threshold: 100
        permitted-number-of-calls-in-half-open-state: 1
        wait-duration-in-open-state: 1s

  timelimiter:
    instances:
      httpTimeout:
        timeout-duration: 2s

  ratelimiter:
    instances:
      apiRateLimit:
        limit-for-period: 15
        limit-refresh-period: 1m #не более 15 вызовов в минуту

url:
  links: "http://scrapper:8082/links"
  tg-chats: "http://scrapper:8082/tg-chat"
spring:
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1
  kafka:
    topic:
      updates: "notifications"
    bootstrap-servers: kafka:29092
    consumer:
      group-id: bot
  application:
    name: Bot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8082

bot:
  notification:
    mode: DAILY_DIGEST  # or IMMEDIATE
    digest-time: "16:38"  # time of day to send the digest
  cache:
    list-ttl: 300  # TTL for /list cache in seconds (5 minutes)

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
